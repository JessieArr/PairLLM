[package]
name = "pairllm"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
eframe = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
